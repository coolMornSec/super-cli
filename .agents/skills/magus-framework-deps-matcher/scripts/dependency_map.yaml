mysql:
  keywords:
    - mysql
    - mysql数据库
    - 关系型数据库
    - jdbc mysql
  dependency: mysql-connector-j
  description: MySQL 数据库驱动
  config_example: |
    spring:
      datasource:
        url: jdbc:mysql://localhost:3306/mydb
        username: root
        password: secret

postgresql:
  keywords:
    - postgresql
    - postgres
    - pg
    - postgresql数据库
  dependency: postgresql
  description: PostgreSQL 数据库驱动
  config_example: |
    spring:
      datasource:
        url: jdbc:postgresql://localhost:5432/mydb
        username: postgres

